[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "testcli"
version = "0.1.0"
description = "Sample CLI used as a target for Hermes Echo"
requires-python = ">=3.9"
dependencies = ["pyyaml>=5.4"]

[project.scripts]
testcli = "testcli.cli:main"

[tool.setuptools]
packages = ["testcli"]
